name: physics checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run python -m keeler encounters --out runs/ci
      - run: uv run python -m keeler boxes --case no_collisions --out runs/ci
